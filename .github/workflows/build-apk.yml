name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add Capacitor Android Platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant Execute Permission to Gradlew
        run: |
          cd android
          chmod +x gradlew || true

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Ensure Signing Keystore Exists
        run: |
          if [ ! -f "android/app/release-key.jks" ]; then
            keytool -genkeypair -v -keystore android/app/release-key.jks -alias material-ereader -keyalg RSA -keysize 2048 -validity 10000 -storepass material123 -keypass material123 -dname "CN=Material EReader, OU=Mobile, O=OpenSource, L=Global, ST=Global, C=RU"
          fi

      - name: Build Signed Debug APK
        run: |
          cd android
          VERSION_CODE=$((10000 + ${{ github.run_number }}))
          ./gradlew assembleDebug -PversionCode=$VERSION_CODE --stacktrace --no-daemon

      - name: Build Signed Release APK
        run: |
          cd android
          VERSION_CODE=$((10000 + ${{ github.run_number }}))
          ./gradlew assembleRelease -PversionCode=$VERSION_CODE --stacktrace --no-daemon || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: material-ereader-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-ereader-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
